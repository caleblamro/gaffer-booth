<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="gb.css" />
<link rel="stylesheet" href="live.css" />
<title>Multiview</title>
<style>
  .mv { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 10px; padding: 14px; }
  .tile { position: relative; border-radius: 10px; overflow: hidden; background: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); min-height: 0; }
  .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tile.pgm { grid-column: 1 / 3; grid-row: 1 / 3; box-shadow: 0 0 0 3px var(--tally); }
  .tile.pvw { box-shadow: 0 0 0 3px var(--fg-2); }
  .tile .wm { display: none; }
  .lab { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: rgba(10, 13, 12, 0.82); font-size: 12.5px; }
  .lab .mono { font-size: 11px; color: var(--fg-3); border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 5px; }
  .lab em { margin-left: auto; font: 600 10.5px var(--mono); font-style: normal; letter-spacing: .08em; padding: 2px 6px; border-radius: 3px; }
  .lab em.pg { background: var(--tally); color: #fff; }
  .lab em.pv { border: 1px solid var(--fg-2); color: var(--fg-2); }
  .lab small { color: var(--fg-3); font-size: 11.5px; }
  .pgm .lab { font-size: 14px; padding: 9px 12px; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 0 14px 14px; }
  .bar .note { font-size: 12.5px; color: var(--fg-3); }
</style>
</head>
<body>
<script src="gb.js"></script>
<script src="cam.js"></script>
<script>
  const tile = (k, n, i, cls = "", note = "") => `<div class="tile ${cls}">${k === "radar" ? pitch({ bug: false }) : camView(k)}${cls === "pgm" ? bugHtml() : ""}<div class="lab"><span class="mono">${i}</span>${n}${note ? `<small>${note}</small>` : ""}${cls === "pgm" ? '<em class="pg">PGM</em>' : cls === "pvw" ? '<em class="pv">PVW</em>' : ""}</div></div>`;
  document.body.innerHTML = `
  <header class="top">${wordmark()}<span class="sep"></span><span class="fixture">Harbour City v Westbridge Rovers</span><span class="tally">On air</span>
    <div class="right"><div class="seg"><button>Program</button><button class="on">Multiview</button></div><div class="seg"><button class="on">Director · auto</button><button>Manual</button></div><button class="btn">Pause <span class="kbd">Space</span></button></div></header>
  <main class="mv">
    ${tile("main", "Main", 1, "pgm", "Director cut here at 55:41 for the goal")}
    ${tile("goal", "Behind goal", 3, "pvw", "Queued for replay")}
    ${tile("tactical", "Tactical", 2)}
    ${tile("iso", "Isolation · Delacroix", 4)}
    ${tile("reverse", "Reverse", 6)}
    ${tile("radar", "Radar", 5)}
  </main>
  <div class="bar"><span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span><span class="kbd">4</span><span class="kbd">5</span><span class="kbd">6</span><span class="note">Press a number to cut to that camera. Taking a cut switches the Director to manual until you hand it back.</span><button class="btn" style="margin-left:auto">Cut to preview <span class="kbd">Enter</span></button></div>`;
  nb("11 Multiview");
</script>
</body>
</html>
