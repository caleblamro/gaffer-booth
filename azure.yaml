# Azure Developer CLI: `azd up` provisions Container Apps (and Foundry with GAFFER_FOUNDRY=on)
# and deploys the app. See "Deploy to Azure" in the README.
name: gaffer-booth
metadata:
  template: gaffer-booth@0.1.0
services:
  web:
    project: .
    language: docker
    host: containerapp
    docker:
      path: Dockerfile
      # Build in Azure Container Registry, so deploying needs no local Docker (and no
      # amd64 cross-build on Apple silicon).
      remoteBuild: true
