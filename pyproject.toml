[project]
name = "gaffer-booth"
version = "0.1.0"
description = "An AI broadcast crew for synthetic football matches (Microsoft x Premier League Inside the Game hackathon)."
requires-python = ">=3.11"
dependencies = [
  "agent-framework-core>=1.21",
  "agent-framework-foundry>=1.14",
  "agent-framework-openai>=1.16",
  "azure-identity>=1.19",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["booth*"]
